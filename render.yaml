services:
  # ── CivicSense AI FastAPI Backend Service ──
  - type: web
    name: civicsense-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CIVICSENSE_HOST
        value: 0.0.0.0

  # ── CivicSense AI React Frontend Dashboard ──
  - type: web
    name: civicsense-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: ./client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
